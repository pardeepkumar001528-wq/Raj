name: Build and Run 50

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot pytz pymongo

      - name: Compile raj.c
        run: |
          gcc -O2 -o bgmi raj.c -pthread
          chmod +x bgmi

      - name: Run raj.py
        run: |
          python raj.py
